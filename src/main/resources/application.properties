spring.application.name=marketpulse

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/marketpulse}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

ebay.notification.verification-token=${EBAY_NOTIFICATION_VERIFICATION_TOKEN}
ebay.notification.endpoint=${EBAY_NOTIFICATION_ENDPOINT}