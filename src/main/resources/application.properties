spring.application.name=marketpulse

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/marketpulse}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:parool}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

ebay.client-id=${EBAY_CLIENT_ID:}
ebay.client-secret=${EBAY_CLIENT_SECRET:}
ebay.marketplace-id=${EBAY_MARKETPLACE_ID:EBAY_DE}

ebay.notification.verification-token=${EBAY_NOTIFICATION_VERIFICATION_TOKEN:MarketPulse_local_verification_token_1234567890}
ebay.notification.endpoint=${EBAY_NOTIFICATION_ENDPOINT:http://localhost:8080/api/ebay/notifications}